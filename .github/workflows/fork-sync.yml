# Fork (Suslicke/nutritrace): daily, put the `suslicke` branch back on top of upstream `dev`.
# A conflict fails this run (GitHub emails it); resolve locally:
#   git fetch upstream && git rebase upstream/dev && git push --force-with-lease origin suslicke
# SYNC_TOKEN: fine-grained PAT for this repo only, Contents + Workflows read/write (GITHUB_TOKEN may
# not push changed workflow files, and its pushes would not start the image build).
name: fork sync
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suslicke
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - run: |
          git config user.name "fork-sync"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add upstream https://github.com/TraceApps/nutritrace.git
          git fetch upstream dev
          if git merge-base --is-ancestor upstream/dev HEAD; then echo "up to date"; exit 0; fi
          git rebase upstream/dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test scripts/trace-extra.test.js scripts/codex-cli.test.js scripts/webpush.test.js
      - run: git push --force-with-lease origin suslicke
